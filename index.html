<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>NumDrop</title>
  <meta name="description" content="Place numbered shapes, merge matching numbers, clear lines. A relaxing puzzle — no timer, no internet needed." />

  <!-- PWA / Mobile -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="NumDrop" />
  <meta name="theme-color" content="#0f1119" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">

    <!-- TITLE SCREEN -->
    <div class="screen active" id="titleScreen">
      <div class="title-bg">
        <div class="bg-num n1">2</div>
        <div class="bg-num n2">8</div>
        <div class="bg-num n3">32</div>
        <div class="bg-num n4">4</div>
        <div class="bg-num n5">16</div>
        <div class="bg-num n6">64</div>
      </div>
      <div class="title-content">
        <h1 class="title-name">NUM<span>DROP</span></h1>
        <p class="title-sub">Drop. Merge. Blast.</p>
        <div class="title-buttons">
          <button class="btn btn-primary" id="btnNewGame">New Game</button>
          <button class="btn btn-secondary" id="btnContinue" style="display:none">Continue</button>
        </div>
        <div class="title-best" id="titleBest"></div>
      </div>
    </div>

    <!-- GAME SCREEN -->
    <div class="screen" id="gameScreen">
      <div class="game-top">
        <button class="icon-btn" id="btnPause">II</button>
        <div class="score-area">
          <div class="score-box">
            <div class="score-label">SCORE</div>
            <div class="score-val" id="scoreVal">0</div>
          </div>
          <div class="score-box">
            <div class="score-label">BEST</div>
            <div class="score-val dim" id="bestVal">0</div>
          </div>
        </div>
      </div>

      <div class="board-wrap" id="boardWrap">
        <canvas id="boardCanvas"></canvas>
      </div>

      <div class="popup" id="popup"></div>
      <div class="score-pop" id="scorePop"></div>

      <div class="tray" id="tray"></div>
    </div>

    <!-- PAUSE OVERLAY -->
    <div class="overlay" id="pauseOverlay">
      <div class="modal">
        <h2>Paused</h2>
        <div class="modal-btns">
          <button class="btn btn-primary" id="btnResume">Resume</button>
          <button class="btn btn-secondary" id="btnRestartP">Restart</button>
          <button class="btn btn-ghost" id="btnHomeP">Home</button>
        </div>
      </div>
    </div>

    <!-- GAME OVER OVERLAY -->
    <div class="overlay" id="overOverlay">
      <div class="modal">
        <h2>Game Over</h2>
        <div class="over-score">
          <div class="over-label">Score</div>
          <div class="over-val" id="overScore">0</div>
        </div>
        <div class="over-best" id="overBest"></div>
        <div class="over-highest" id="overHighest"></div>
        <div class="modal-btns">
          <button class="btn btn-primary" id="btnRetry">Play Again</button>
          <button class="btn btn-ghost" id="btnHomeO">Home</button>
        </div>
      </div>
    </div>

    <!-- DRAG GHOST (floating piece follows finger) -->
    <div class="drag-ghost" id="dragGhost"></div>

  </div>
  <script src="app.js"></script>
</body>
</html>
