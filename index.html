<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>NumDrop</title>
  <meta name="description" content="Place numbered shapes, merge matching numbers, clear lines. A relaxing puzzle — no timer, no internet needed." />

  <!-- PWA / Mobile -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="NumDrop" />
  <meta name="theme-color" content="#051223" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- GLOBAL ANIMATED BACKGROUND -->
  <div class="global-bg" id="globalBg">
    <div class="bg-grid"></div>
    <div class="bg-shape bs1"></div>
    <div class="bg-shape bs2"></div>
    <div class="bg-shape bs3"></div>
    <div class="bg-shape bs4"></div>
    <div class="bg-shape bs5"></div>
    <div class="bg-shape bs6"></div>
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>
    <div class="bg-glow bg-glow-3"></div>
  </div>

  <div id="app">

    <!-- TITLE SCREEN -->
    <div class="screen active" id="titleScreen">
      <div class="title-topbar">
        <div class="gold-pill" id="homeGoldPill">
          <span class="coin-icon"></span>
          <span id="homeGoldVal">0</span>
        </div>
        <button class="icon-btn gear-btn" id="btnSettings" title="Settings">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path fill="currentColor" d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm9.4 4c0-.4 0-.8-.1-1.2l2.1-1.6-2-3.4-2.5.9c-.6-.5-1.3-.9-2-1.2L16.5 3h-4l-.4 2.5c-.7.3-1.4.7-2 1.2l-2.5-.9-2 3.4L7.7 10.8c0 .4-.1.8-.1 1.2s0 .8.1 1.2l-2.1 1.6 2 3.4 2.5-.9c.6.5 1.3.9 2 1.2l.4 2.5h4l.4-2.5c.7-.3 1.4-.7 2-1.2l2.5.9 2-3.4-2.1-1.6c.1-.4.1-.8.1-1.2Z"/>
          </svg>
        </button>
      </div>
      <div class="title-content">
        <h1 class="title-name">NUM<span class="rainbow-text">DROP</span></h1>
        <p class="title-sub">Drop. Merge. Blast.</p>

        <div class="title-skills" id="homeSkills">
          <div class="hs-item" data-k="trash">
            <svg viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="2" rx="1" fill="currentColor"/><rect x="10" y="3" width="4" height="2" rx="0.5" fill="currentColor"/><path d="M6 8 L7.2 20 Q7.3 21.2 8.5 21.2 L15.5 21.2 Q16.7 21.2 16.8 20 L18 8 Z" fill="currentColor"/></svg>
            <span class="hs-count" id="hsTrash">0</span>
          </div>
          <div class="hs-item" data-k="swap">
            <svg viewBox="0 0 24 24"><path d="M5 12 A 7 7 0 0 1 17 7 L15 9 L20 9 L20 4 L18 6 A 9 9 0 0 0 3 12 Z" fill="currentColor"/><path d="M19 12 A 7 7 0 0 1 7 17 L9 15 L4 15 L4 20 L6 18 A 9 9 0 0 0 21 12 Z" fill="currentColor"/></svg>
            <span class="hs-count" id="hsSwap">0</span>
          </div>
          <div class="hs-item" data-k="hammer">
            <svg viewBox="0 0 24 24"><rect x="4" y="3" width="13" height="6" rx="1.2" fill="currentColor"/><rect x="10.2" y="9" width="2" height="12" rx="0.6" fill="#b8865a"/></svg>
            <span class="hs-count" id="hsHammer">0</span>
          </div>
          <div class="hs-item" data-k="bomb">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="14" r="7" fill="currentColor"/><path d="M14 7.5 Q16 5.5 17.5 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/><circle cx="17.5" cy="4" r="2" fill="#facc15"/></svg>
            <span class="hs-count" id="hsBomb">0</span>
          </div>
        </div>

        <div class="title-buttons">
          <button class="btn btn-primary" id="btnNewGame">New Game</button>
          <button class="btn btn-secondary" id="btnContinue" style="display:none">Continue</button>
          <button class="btn btn-store" id="btnStore">
            <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M4 6l1-3h14l1 3v2H4V6Zm0 4h16v10a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V10Zm6 3v4h4v-4h-4Z"/></svg>
            Store
          </button>
        </div>
        <div class="title-best" id="titleBest"></div>
      </div>
    </div>

    <!-- GAME SCREEN -->
    <div class="screen" id="gameScreen">
      <div class="game-top">
        <button class="icon-btn" id="btnPause">II</button>
        <div class="score-area">
          <div class="score-box">
            <div class="score-label">SCORE</div>
            <div class="score-val" id="scoreVal">0</div>
          </div>
          <div class="score-box">
            <div class="score-label">BEST</div>
            <div class="score-val dim" id="bestVal">0</div>
          </div>
        </div>
        <div class="gold-pill small" id="gameGoldPill">
          <span class="coin-icon"></span>
          <span id="gameGoldVal">0</span>
        </div>
        <button class="icon-btn sound-btn" id="btnSound" title="Toggle Sound">&#9835;</button>
      </div>

      <!-- SKILL PROGRESS BAR — fills with score, grants a random skill -->
      <div class="skill-progress" id="skillProgress">
        <div class="sp-fill" id="spFill"></div>
        <div class="sp-label"><span id="spLabel">Next Skill</span></div>
      </div>

      <div class="board-wrap" id="boardWrap">
        <canvas id="boardCanvas"></canvas>
        <canvas id="effectsCanvas" class="effects-canvas"></canvas>
      </div>

      <div class="popup" id="popup"></div>
      <div class="score-pop" id="scorePop"></div>

      <!-- SKILL REWARD FLYOUT -->
      <div class="skill-reward" id="skillReward">
        <div class="sr-rays"></div>
        <div class="sr-ring"></div>
        <div class="sr-badge" id="srBadge"></div>
        <div class="sr-text">New Skill!</div>
        <div class="sr-name" id="srName">Trash</div>
      </div>

      <!-- POWER-UPS BAR -->
      <div class="powerups" id="powerups">
        <button class="pu-btn" data-pu="trash" id="puTrash">
          <span class="pu-icon">
            <svg class="pu-svg" viewBox="0 0 24 24" aria-hidden="true">
              <g class="pu-anim-trash-lid">
                <rect x="4" y="5.5" width="16" height="2" rx="1" fill="currentColor"/>
                <rect x="10" y="3" width="4" height="2" rx="0.5" fill="currentColor"/>
              </g>
              <path d="M6 8 L7.2 20 Q7.3 21.2 8.5 21.2 L15.5 21.2 Q16.7 21.2 16.8 20 L18 8 Z" fill="currentColor"/>
              <line x1="10" y1="11" x2="10" y2="18" stroke="#0e2540" stroke-width="1.4" stroke-linecap="round"/>
              <line x1="14" y1="11" x2="14" y2="18" stroke="#0e2540" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
          </span>
          <span class="pu-label">Trash</span>
          <span class="pu-count" id="puTrashCount">3</span>
        </button>
        <button class="pu-btn" data-pu="reshuffle" id="puReshuffle">
          <span class="pu-icon">
            <svg class="pu-svg" viewBox="0 0 24 24" aria-hidden="true">
              <g class="pu-anim-swap-rot">
                <path d="M5 12 A 7 7 0 0 1 17 7 L15 9 L20 9 L20 4 L18 6 A 9 9 0 0 0 3 12 Z" fill="currentColor"/>
                <path d="M19 12 A 7 7 0 0 1 7 17 L9 15 L4 15 L4 20 L6 18 A 9 9 0 0 0 21 12 Z" fill="currentColor"/>
              </g>
            </svg>
          </span>
          <span class="pu-label">Swap</span>
          <span class="pu-count" id="puReshuffleCount">1</span>
        </button>
        <button class="pu-btn" data-pu="hammer" id="puHammer">
          <span class="pu-icon">
            <svg class="pu-svg" viewBox="0 0 24 24" aria-hidden="true">
              <g class="pu-anim-hammer-swing">
                <rect x="4" y="3" width="13" height="6" rx="1.2" fill="currentColor"/>
                <rect x="5" y="4.5" width="11" height="1.2" rx="0.5" fill="rgba(255,255,255,0.3)"/>
                <rect x="10.2" y="9" width="2" height="12" rx="0.6" fill="#b8865a"/>
              </g>
            </svg>
          </span>
          <span class="pu-label">Hammer</span>
          <span class="pu-count" id="puHammerCount">1</span>
        </button>
        <button class="pu-btn pu-rare" data-pu="bomb" id="puBomb">
          <span class="pu-icon">
            <svg class="pu-svg" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="14" r="7" fill="currentColor"/>
              <circle cx="8.5" cy="11.5" r="1.3" fill="rgba(255,255,255,0.35)"/>
              <path d="M14 7.5 Q16 5.5 17.5 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/>
              <g class="pu-anim-bomb-spark">
                <circle cx="17.5" cy="4" r="2" fill="#facc15"/>
                <circle cx="17.5" cy="4" r="1" fill="#fff"/>
              </g>
            </svg>
          </span>
          <span class="pu-label">Bomb</span>
          <span class="pu-count" id="puBombCount">1</span>
        </button>
      </div>

      <div class="tray" id="tray"></div>
    </div>

    <!-- PAUSE OVERLAY -->
    <div class="overlay" id="pauseOverlay">
      <div class="modal">
        <h2>Paused</h2>
        <div class="modal-btns">
          <button class="btn btn-primary" id="btnResume">Resume</button>
          <button class="btn btn-secondary" id="btnRestartP">Restart</button>
          <button class="btn btn-ghost" id="btnHomeP">Home</button>
        </div>
      </div>
    </div>

    <!-- GAME OVER OVERLAY -->
    <div class="overlay" id="overOverlay">
      <div class="modal">
        <h2>Game Over</h2>
        <div class="over-score">
          <div class="over-label">Score</div>
          <div class="over-val" id="overScore">0</div>
        </div>
        <div class="over-best" id="overBest"></div>
        <div class="over-highest" id="overHighest"></div>
        <div class="modal-btns">
          <button class="btn btn-primary" id="btnRetry">Play Again</button>
          <button class="btn btn-ghost" id="btnHomeO">Home</button>
        </div>
      </div>
    </div>

    <!-- STORE OVERLAY -->
    <div class="overlay" id="storeOverlay">
      <div class="modal modal-store">
        <div class="store-header">
          <h2>Store</h2>
          <div class="gold-pill">
            <span class="coin-icon"></span>
            <span id="storeGoldVal">0</span>
          </div>
        </div>
        <p class="store-sub">Buy gold to unlock powerful skills.</p>
        <div class="store-list" id="storeList"></div>
        <div class="modal-btns">
          <button class="btn btn-ghost" id="btnCloseStore">Close</button>
        </div>
      </div>
    </div>

    <!-- SETTINGS OVERLAY -->
    <div class="overlay" id="settingsOverlay">
      <div class="modal">
        <h2>Settings</h2>
        <div class="settings-list">
          <label class="setting-row">
            <span class="setting-label">Music & Sound</span>
            <span class="toggle" id="setSound"><span class="knob"></span></span>
          </label>
          <label class="setting-row">
            <span class="setting-label">Vibration</span>
            <span class="toggle" id="setVibe"><span class="knob"></span></span>
          </label>
          <button class="btn btn-secondary" id="btnResetProgress">Reset All Progress</button>
        </div>
        <div class="modal-btns">
          <button class="btn btn-ghost" id="btnCloseSettings">Close</button>
        </div>
      </div>
    </div>

    <!-- DRAG GHOST (floating piece follows finger) -->
    <div class="drag-ghost" id="dragGhost"></div>

    <!-- HAMMER MODE INDICATOR -->
    <div class="hammer-mode" id="hammerMode">
      <span>&#128296;</span> Tap a block to remove it
      <button id="hammerCancel">Cancel</button>
    </div>

  </div>
  <script src="app.js"></script>
</body>
</html>
