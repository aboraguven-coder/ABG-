<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>BlockDrop - Puzzle Game</title>
  <meta name="description" content="A relaxing block puzzle game. No timer, no pressure. Play anytime, anywhere — no internet needed." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0f1221" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <!-- START SCREEN -->
    <div class="screen active" id="startScreen">
      <div class="start-bg">
        <div class="float-block fb1"></div>
        <div class="float-block fb2"></div>
        <div class="float-block fb3"></div>
        <div class="float-block fb4"></div>
      </div>
      <div class="start-content">
        <h1 class="game-title">BLOCK<span>DROP</span></h1>
        <p class="game-subtitle">No timer. No pressure. Just puzzles.</p>
        <div class="start-buttons">
          <button class="btn btn-primary" id="btnPlay">Play</button>
          <button class="btn btn-secondary" id="btnContinue" style="display:none">Continue</button>
        </div>
        <div class="start-highscore" id="startHighscore"></div>
      </div>
    </div>

    <!-- GAME SCREEN -->
    <div class="screen" id="gameScreen">
      <div class="game-header">
        <button class="icon-btn" id="btnPause" title="Pause">II</button>
        <div class="score-display">
          <div class="score-label">Score</div>
          <div class="score-value" id="scoreValue">0</div>
        </div>
        <div class="best-display">
          <div class="score-label">Best</div>
          <div class="score-value" id="bestValue">0</div>
        </div>
      </div>

      <div class="board-container">
        <canvas id="gameCanvas"></canvas>
        <div class="combo-popup" id="comboPopup"></div>
      </div>

      <div class="pieces-tray" id="piecesTray"></div>
    </div>

    <!-- PAUSE OVERLAY -->
    <div class="overlay" id="pauseOverlay">
      <div class="modal">
        <h2>Paused</h2>
        <div class="modal-buttons">
          <button class="btn btn-primary" id="btnResume">Resume</button>
          <button class="btn btn-secondary" id="btnRestartPause">Restart</button>
          <button class="btn btn-ghost" id="btnHomePause">Home</button>
        </div>
      </div>
    </div>

    <!-- GAME OVER OVERLAY -->
    <div class="overlay" id="gameOverOverlay">
      <div class="modal">
        <h2>Game Over</h2>
        <div class="final-score">
          <div class="final-label">Score</div>
          <div class="final-value" id="finalScore">0</div>
        </div>
        <div class="final-best" id="finalBest"></div>
        <div class="modal-buttons">
          <button class="btn btn-primary" id="btnRestartOver">Play Again</button>
          <button class="btn btn-ghost" id="btnHomeOver">Home</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
